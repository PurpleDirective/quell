<!doctype html><html class="userconsent-cntry-us userconsent-reg-global"><head><title>CNN-shaped consent wall</title>
<style>body{margin:0;font-family:sans-serif} header{background:#fff;height:60px} main p{margin:0 0 20px}</style></head>
<!-- Shape of edition.cnn.com, measured live 2026-11-06 (logged out, headless Chromium): the wall is an
     unnamed full-viewport div (aria-hidden, inline style, z-index 999999) holding a role=dialog; the
     page is frozen with inline body styles and the header is inert. -->
<body class="layout layout-homepage cnn" style="max-height: 800px; max-width: 1280px; height: 800px; width: 1280px; overflow: hidden; position: fixed;">
<header class="header__wrapper-outer" inert id="cnn-header"><a id="cnn-signin" href="/account">Sign in</a></header>
<main id="cnn-main"><h1>The news</h1><div id="cnn-story" style="height:2400px"><p>Story text, plenty of it.</p></div></main>
<div aria-hidden="true" id="cnn-wall" style="background-color: rgba(0, 0, 0, 0.4); position: fixed; min-width: 100%; min-height: 100%; inset: 0px; z-index: 999999;">
  <div role="dialog" aria-modal="true" style="position:fixed;left:290px;top:200px;width:700px;background:#fff;padding:40px">
    <h2>Legal Terms and Privacy</h2>
    <p>By clicking "Agree", you agree to the <a href="/terms">Terms of Use</a> and to the collection and use of your information by cookies and similar technologies, as set forth in our <a href="/privacy">Privacy Policy</a>.</p>
    <a role="button" href="#" id="cnn-agree">Agree</a>
  </div></div>
</body></html>
